---

state: present
zfs_vars_file: ""
zfs_pools:
  - name: data
    properties:
      ashift: 12
      autotrim: "on"
    mount_point: "/mnt/data"
    force_import: false
    vdevs:
      type: mirror
      disks:
        - /dev/sda
        - /dev/sdb
zfs_datasets:
  - name: data/projects
    properties:
      compression: lz4
      atime: "off"
      mountpoint: /mnt/data/projects
  - name: data/homes
    properties:
      compression: lz4
      atime: "off"
      mountpoint: /mnt/data/homes

...
